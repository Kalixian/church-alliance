[project]
name = "church-alliance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy>=2.0.49",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "httpx>=0.24.0",
    "cloudinary>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "isort",
    "pre-commit",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
