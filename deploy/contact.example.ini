# Settings for static/cgi-bin/contact.py (the static site's Contact Us form).
#
# With Docker (docker-compose.yml): copy this file to deploy/contact.ini
# (git-ignored), fill it in and `chmod 600` it. The static-site container
# mounts it read-only and hands it to Apache; it never goes into the image.
#
# Without Docker: put it outside the public web root, make it readable only by
# the web server user, and point the script at it, e.g. in the Apache vhost:
#
#     SetEnv CONTACT_CONFIG /etc/church-alliance/contact.ini
#
# Any value can instead be set as an environment variable named
# CONTACT_<KEY> (e.g. CONTACT_SMTP_PASSWORD), which overrides this file.
#
# Use the same Gmail SMTP details as the Supabase project's custom SMTP
# settings (Supabase dashboard > Authentication > SMTP Settings).

[contact]
smtp_host = smtp.gmail.com
# 587 uses STARTTLS; 465 uses implicit TLS.
smtp_port = 587
# The Gmail account that sends the mail.
smtp_user = you@gmail.com
# A Google app password (requires 2-Step Verification), not the account password.
smtp_password = abcd efgh ijkl mnop
# Address shown in From. Gmail only allows the account itself or a verified alias.
# Defaults to smtp_user.
sender =
sender_name = Church Alliance Website
# Where contact messages are delivered. Never appears in the site's HTML.
recipient = contact@example.org
# Page the visitor returns to; #sent, #error or #busy is appended.
redirect = /contact.html
