# Production stack for the self-hosted server. Caddy is the single entry point
# (HTTPS, ports 80/443) and routes to the other services on the "web" network,
# which don't publish ports. For local development use docker-compose.dev.yml.
#
#   docker compose up -d --build
#
# Needs deploy/site.env (see site.example.env), the root .env (api) and
# frontend/.env (read when the frontend is built).
#
# The old Apache static site (static/) is no longer deployed: the React app
# replaces it at https://<domain>.
name: church-alliance

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: deploy/site.env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates; keep this volume or Let's Encrypt rate limits may apply
      - caddy_config:/config
    networks: [web]
    depends_on: [frontend, api]

  # FastAPI backend, reached as https://<domain>/api/... (same origin as the
  # React app, so no CORS is involved).
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env so SQLite lands on the volume.
      # To use another database, change this line.
      DATABASE_URL: sqlite:////data/church-alliance.db
    volumes:
      - api_data:/data
    networks: [web]

  # React app (static build). VITE_* values are baked in at build time, so
  # rebuild (`docker compose up -d --build frontend`) after editing frontend/.env.
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  api_data: # the SQLite database; back this up
